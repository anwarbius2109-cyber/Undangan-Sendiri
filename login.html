<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white p-6">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Dashboard Portfolio</h1>
  <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded-xl">
    Logout
  </button>
</div>

<!-- FORM -->
<div class="bg-gray-900 p-4 rounded-xl mb-6">
  <input id="title" placeholder="Title"
    class="w-full p-2 mb-2 bg-gray-800 rounded">

  <input id="image" placeholder="Image URL"
    class="w-full p-2 mb-2 bg-gray-800 rounded">

  <input id="demo" placeholder="Demo Link"
    class="w-full p-2 mb-2 bg-gray-800 rounded">

  <input id="category" placeholder="Category"
    class="w-full p-2 mb-2 bg-gray-800 rounded">

  <button onclick="addItem()"
    class="bg-green-600 px-4 py-2 rounded-xl">
    Tambah
  </button>
</div>

<!-- LIST -->
<div id="list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

<script src="script.js"></script>
</body>
</html>
