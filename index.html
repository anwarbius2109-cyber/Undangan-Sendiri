<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 flex items-center justify-center h-screen text-white">

  <div class="bg-gray-900 p-6 rounded-2xl w-80">
    <h1 class="text-xl font-bold mb-4">Admin Login</h1>

    <input id="pass" type="password"
      class="w-full p-2 rounded bg-gray-800 mb-3"
      placeholder="Password">

    <button onclick="login()"
      class="w-full bg-blue-600 py-2 rounded-xl">
      Login
    </button>

    <p id="msg" class="text-red-400 text-sm mt-2"></p>
  </div>

<script>
function login(){
  const pass = document.getElementById("pass").value;

  // ganti password di sini
  if(pass === "admin123"){
    localStorage.setItem("auth", "true");
    window.location.href = "index.html";
  } else {
    document.getElementById("msg").innerText = "Password salah";
  }
}
</script>

</body>
</html>
